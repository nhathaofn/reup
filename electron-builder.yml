appId: com.nhathaofn.tblao
productName: T-blao
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!font/**'
  - '!resources/fonts/**'
  # Never package local sessions or credential files, even if copied into the repo.
  - '!cookies{,/**}'
  - '!cookies.txt'
  - '!cookies-*.txt'
  - '!cookies.txt.*.legacy-unmigrated'
  - '!cookies-*.txt.*.legacy-unmigrated'
  - '!**/*.cookies.json'
  - '!**/Network/Cookies'
  - '!**/Network/Cookies-journal'
  - '!**/.env{,.*}'
  - '!**/*.pem'
  - '!**/*.key'
  # Khong nhet engine/clone/zip vao installer (tai tu assets-v1 luc chay)
  - '!repo test{,/**}'
  - '!dist-engine{,/**}'
  # Never package local portable build outputs back into another artifact.
  - '!dist-local{,/**}'
  - '!dist-local-*{,/**}'
  - '!engines{,/**}'
  - '!.capcut-sample-check{,/**}'
  - '!test-artifacts{,/**}'
  - '!tmp_capcut_probe.json'
  - '!**/*.zip'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
extraResources:
  - from: build/runtime/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg.exe
      - ffprobe.exe
      - FFMPEG-NOTICE.txt
  - from: resources/fonts
    to: fonts
    filter:
      - '**/*'
  - from: scripts/text-remove-engine.py
    to: text-remove/text-remove-engine.py
win:
  target:
    - nsis
  icon: build/icon.ico
  # The project has no code-signing certificate. Skipping executable resource
  # editing also keeps local Windows builds compatible with standard user
  # accounts that cannot create symlinks while unpacking winCodeSign.
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.utilities
  artifactName: ${productName}-${version}.${ext}
# Nguon phat hanh cho electron-updater (app tu cap nhat tu GitHub Releases).
# Release assets are published to a separate public repository. The source
# repository can therefore remain private while electron-updater stays public.
publish:
  provider: github
  owner: nhathaofn
  repo: releases
