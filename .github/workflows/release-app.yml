name: Build & Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            package_script: package:win
            artifact_name: release-windows
            artifact_paths: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package app
        run: npm run ${{ matrix.package_script }}

      - name: Verify Windows package is runtime-free
        run: npm run verify:package:win

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify update payloads
        shell: bash
        run: |
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          test -f release-assets/latest.yml
          test -n "$(find release-assets -maxdepth 1 -name '*.blockmap' -print -quit)"

      - name: Publish to public release repository
        uses: softprops/action-gh-release@v2
        with:
          repository: nhathaofn/releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: T-blao ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          fail_on_unmatched_files: true
          files: release-assets/*
